name: Deploy beta (Cloudflare Workers)

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-beta
  cancel-in-progress: true

jobs:
  deploy:
    name: Construir y desplegar beta
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Configurar Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Construir dist/
        run: npm run build

      - name: Desplegar en Cloudflare Workers
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.beta.jsonc

      - name: Configurar token del contador
        env:
          DESCARGAS_TOKEN: ${{ secrets.DESCARGAS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$DESCARGAS_TOKEN" ]; then
            echo "DESCARGAS_TOKEN no configurado; se omite el token del contador."
            exit 0
          fi
          printf '%s' "$DESCARGAS_TOKEN" | npx wrangler secret put ADMIN_TOKEN --config wrangler.beta.jsonc
