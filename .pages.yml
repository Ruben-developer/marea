# Configuración de Pages CMS (https://pagescms.org) para MAREA.
# Se lee desde la raíz del repo. Edita catalogo.json con formularios.
#
# Los PDFs viven en pdfs/ y se sirven con el mismo Worker.
# Las portadas sí se suben acá: viven en covers/ y pesan poco.

media:
  input: covers
  output: covers
  rename: safe
  extensions: [jpg, jpeg, png, webp]
  categories: [image]

content:
  - name: catalogo
    label: Catálogo
    type: file
    path: catalogo.json
    format: json
    list: true
    fields:
      - name: titulo
        label: Título
        type: string
        required: true

      - name: autor
        label: Autoría
        type: string
        description: "Si se deja vacío, el sitio muestra «Sin autoría»."

      - name: coleccion
        label: Colección
        type: select
        required: true
        options:
          values:
            - name: praxis
              label: Praxis
            - name: historia
              label: Historia

      - name: paginas
        label: Páginas
        type: number

      - name: sinopsis
        label: Sinopsis
        type: text
        description: "Vacía por ahora: es lo que falta escribir. Dos o tres frases."

      - name: portada
        label: Portada
        type: image
        description: "Opcional. Se sube a covers/. Si falta, el sitio dibuja una portada generada."

      - name: archivo
        label: Archivo PDF
        type: string
        description: "Nombre del PDF en pdfs/, por ejemplo la-comuna-de-paris.pdf. El PDF se sube aparte, no por acá."

      - name: enlace
        label: Enlace externo
        type: string
        description: "Alternativa al PDF: URL de otra web o archivo (Mega, Internet Archive)."

      - name: precio
        label: Precio (CLP)
        type: number
        description: "Vacío = solo digital, sin venta. Con precio y PDF se habilita el encargo."

      - name: stock
        label: Stock
        type: number
        description: "Unidades disponibles. 0 = solo digital: se descarga el PDF pero no se puede encargar."

      - name: destacado
        label: Destacado
        type: boolean
        description: "Aparece en la portada, en «Destacados»."

      - name: id
        label: Identificador (opcional)
        type: string
        description: "Déjalo vacío: se genera del título. Las fichas viejas usan m-001…m-067."
