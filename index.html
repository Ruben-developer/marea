<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marea — Catálogo</title>
    <meta name="description" content="Catálogo de Marea, editorial libertaria: historia anarquista, ideas y praxis.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Marea</h1>
        <p class="lema">Editorial libertaria · Historia y Praxis</p>
        <div class="filtros">
            <input type="text" id="buscador" placeholder="Buscar por título o autoría..." autocomplete="off">
            <select id="filtroColeccion">
                <option value="todos">Todas las colecciones</option>
                <option value="historia">Historia</option>
                <option value="praxis">Praxis</option>
            </select>
        </div>
    </header>
    <main>
        <div id="catalogo" class="grid"></div>
    </main>
    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
